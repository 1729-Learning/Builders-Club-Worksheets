<!DOCTYPE html>
<!--
  Builders Club — semester worksheets.
  A single-page app served by server.js. Students sign in with their school
  Microsoft account; progress is saved per student on the server.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester Worksheets · Builders Club</title>
<link rel="icon" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="pad-bg"></div>
<div class="gearfield" aria-hidden="true">
  <div class="mg mg-l1" data-gear data-gear-speed="300" data-gear-dir="1"></div>
  <div class="mg mg-l2" data-gear data-gear-speed="200" data-gear-dir="-1"></div>
  <div class="mg mg-r1" data-gear data-gear-speed="260" data-gear-dir="-1"></div>
  <div class="mg mg-r2" data-gear data-gear-speed="380" data-gear-dir="1"></div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/">
      <img src="./favicon.svg" alt="Builders Club">
      <span><span class="wm">Builders Club</span></span>
    </a>
    <div class="spacer"></div>
    <div class="stat"><span class="num" id="secNum">0</span>/<span class="num" id="secDen">8</span> artifacts</div>
    <div class="stat xp">⚡ <span class="num" id="xpNum">0</span> XP</div>
    <div class="stat streak">🔥 <span class="num" id="streakNum">0</span> streak</div>
    <div class="who" id="who" hidden>
      <span class="who-name" id="whoName"></span>
      <a class="who-out" href="/auth/logout">Sign out</a>
    </div>
    <a class="gear-btn" href="#/instructor" id="instructorBtn" title="Students" hidden>👥</a>
    <a class="gear-btn" href="#/settings" title="Settings">⚙</a>
  </div>
  <div class="auth-banner" id="authBanner" hidden>
    Your sign-in expired. <a href="/auth/login" target="_blank" rel="noopener">Sign in again</a> in a new tab, then come back and retry — nothing you typed here is lost.
  </div>
  <div class="view-banner" id="viewBanner" hidden>
    <span>👁 Viewing <b id="viewName"></b> (read-only)</span>
    <a href="#/instructor">Back to roster</a>
    <button class="ask-btn" data-export>⬇ Builder file</button>
  </div>
</header>

<main class="sheet" id="view"></main>

<button class="totop" id="toTop" title="Back to top" aria-label="Back to top">↑</button>

<script src="./gears.js"></script>
<script src="./content.js"></script>
<script src="./video.js"></script>
<script src="./app.js"></script>
</body>
</html>
